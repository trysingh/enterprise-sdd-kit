<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}__PROJECT_NAME__{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script type="module" src="{{ url_for('static', path='js/app.js') }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">{{ t("app.skip_to_content") }}</a>
  <header class="site-header"><span class="brand">__PROJECT_NAME__</span>{% block nav %}{% endblock %}</header>
  <main id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
{#- Forms on any page include: <input type="hidden" name="csrf_token" value="{{ csrf_token }}"> -#}
