[project]
name = "__PROJECT_SLUG__"
version = "0.1.0"
description = "__PROJECT_NAME__"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.9,<3",
    "pyyaml>=6.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-bdd>=8.0,<9",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "bandit>=1.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"   # no --strict-markers: pytest-bdd turns every @tag (e.g. @SCN-001-01) into a marker
markers = ["ui: browser-level scenario (Playwright)"]

[tool.coverage.run]
branch = true
source = ["src/app"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Spec Kit, OpenCode and ekit tooling live here; it is not this project's code.
extend-exclude = [".specify", ".opencode", ".ekit"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = ["S101"]   # assert is how pytest and pytest-bdd steps check behaviour

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
