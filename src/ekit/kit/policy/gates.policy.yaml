# Gate policy: the deterministic backbone of the BRD > PRD > SDD > TDD pipeline.
#
# Design rules (so the same file can later run in CI / cloud-native pipelines):
#   * A check is a pure function of repository files + test reports. No prompts, no network.
#   * Every check has a stable id, a `type` (implemented in ekit/checks.py) and `with:` params.
#   * `severity: error` fails the gate (exit 1); `warn` is reported only.
#   * Gates are run with `ekit gate <id> [--feature <dir>] [--format text|json|junit]`.
#     JUnit output lets any CI (GitHub Actions, GitLab, Azure DevOps, Jenkins) show results
#     without custom tooling. Later, `runner:` can be set to e.g. `ci-only` per check.
#   * Projects may relax a check ONLY via .ekit/policy.overrides.yaml, which requires a reason
#     and is itself reviewable in the PR.
#
# Placeholders resolved at run time:
#   {feature_dir}  specs/<NNN-name>          (from --feature or the current git branch)
#   {prd_dir}      docs/requirements/<slug>  (from {feature_dir}/trace.yaml or --prd)
apiVersion: ekit.policy/v1
kind: GatePolicy
metadata:
  name: enterprise-generic
  version: 0.7.0

spec:
  defaults:
    severity: error
    runner: local          # local | ci-only | both  (reserved for MVP2 cloud runners)

  gates:
    # ------------------------------------------------------------------ BRD -> PRD
    - id: intake
      stage: brd->prd
      description: BRD normalized, PRD written, every business requirement traced or explicitly out of scope.
      context: prd
      checks:
        - id: INTAKE-FILES
          type: files.exist
          with: { paths: ["{prd_dir}/brd.md", "{prd_dir}/prd.md", "{prd_dir}/open-questions.yaml"] }
        - id: INTAKE-BR-IDS
          type: ids.present
          with: { file: "{prd_dir}/brd.md", pattern: "BR-\\d{3}", min: 1 }
        - id: INTAKE-AC-IDS
          type: ids.unique
          with: { file: "{prd_dir}/prd.md", pattern: "AC-\\d{3}", definition_regex: "^\\s*[-*|]?\\s*\\**(AC-\\d{3})" }
        - id: INTAKE-BR-COVERED
          type: trace.br_covered
          with: { brd: "{prd_dir}/brd.md", prd: "{prd_dir}/prd.md" }
        - id: INTAKE-QUESTIONS-VALID
          type: questions.valid
          with: { file: "{prd_dir}/open-questions.yaml" }
        - id: INTAKE-HAPPY-PATH
          type: happy_path.valid       # 0.7.0 (happy-path lane): happy-path.md exists; every key FEAT is in >=1 journey
          with: { file: "{prd_dir}/happy-path.md" }
        - id: INTAKE-CHANGE-VALID
          type: change.valid           # 0.5.0 (change requests only): change.yaml complete, request verbatim, affects/supersedes real
          with: { dir: "{prd_dir}" }

    # ------------------------------------------------------------------ ready to specify
    - id: ready
      stage: prd->spec
      description: No open blocking question touches this PRD (or the feature's acceptance criteria).
      context: prd
      checks:
        - id: READY-NO-BLOCKING
          type: questions.no_open_blocking
          with: { file: "{prd_dir}/open-questions.yaml" }
        - id: READY-NO-PRD-TBD
          type: text.absent
          with: { file: "{prd_dir}/prd.md", patterns: ["\\[TBD", "\\[NEEDS CLARIFICATION"] }
        - id: READY-CHANGE
          type: change.valid           # 0.5.0 (change requests only): also no [TBD in the bug facts
          with: { dir: "{prd_dir}", ready: true }

    # ------------------------------------------------------------------ design (0.7.0)
    - id: design
      stage: prd->design
      lane: happy-path             # `ekit gate all` runs it only in the happy-path lane; `ekit gate design` always works
      description: The architecture note and design.yaml are complete, traced to the PRD and approved by a person.
      context: project
      checks:
        - id: DESIGN-FILES
          type: files.exist
          with: { paths: ["docs/design/architecture.md", "docs/design/design.yaml"] }
        - id: DESIGN-SECTIONS
          type: design.sections
          with: { file: docs/design/architecture.md }
        - id: DESIGN-SCHEMA
          type: design.schema
          with: {}
        - id: DESIGN-PORTS
          type: design.ports           # every port has a dependency and >=1 method
          with: {}
        - id: DESIGN-SEAMS
          type: design.seams           # all five Day-0 seams declared
          with: {}
        - id: DESIGN-FEATURES
          type: design.features        # every key FEAT has >=1 operation or page and is in exactly one slice
          with: {}
        - id: DESIGN-BRS-LISTED
          type: design.brs_listed      # every in-scope PRD feature is designed and lists all its BRs
          with: {}
        - id: DESIGN-DECISIONS
          type: design.decisions       # status on every decision; accepted ones cite an existing ADR
          with: {}
        - id: DESIGN-JOURNEYS
          type: design.journeys_declared
          with: {}
        - id: DESIGN-APPROVED
          type: design.approved        # a person ran `ekit design approve --by`; stale after any edit
          with: {}

    # ------------------------------------------------------------------ smoke (0.7.0)
    - id: smoke
      stage: slice->adoption
      lane: happy-path
      description: Every key feature is reachable by a user and proven by a passing journey (BR -> FEAT -> operation/page -> journey).
      context: project
      checks:
        - id: SMOKE-RUN
          type: smoke.run              # runs the `journeys` profile command so the reports are fresh
          with: {}
        - id: SMOKE-JOURNEYS-PASS
          type: smoke.journeys_pass
          with: {}
        - id: SMOKE-OPERATION-EXISTS
          type: smoke.operation_exists
          with: {}
        - id: SMOKE-OPERATION-EXERCISED
          type: smoke.operation_exercised
          with: {}
        - id: SMOKE-PAGE-REACHABLE
          type: smoke.page_reachable
          with: {}
        - id: SMOKE-FEATURE-COVERED
          type: smoke.feature_covered
          with: {}
        - id: SMOKE-W0-INTACT
          type: smoke.w0_intact            # after the adoption point the W0 journeys are fingerprinted regression tests
          with: {}
        - id: DESIGN-PORTS-IMPLEMENTED
          type: design.ports_implemented   # AST scan: Protocol + declared methods + dependency + adapter (+ fake: warn)
          with: {}
        - id: BASE-SEAMS-PRESENT
          type: base.seams_present         # golden: the core still exposes the five Day-0 seams
          with: {}

    # ------------------------------------------------------------------ spec quality
    - id: spec
      stage: spec->plan
      description: Spec is traced to PRD acceptance criteria and has no unresolved markers.
      context: feature
      checks:
        - id: SPEC-TRACE-FILE
          type: trace.valid
          with: { trace: "{feature_dir}/trace.yaml" }
        - id: SPEC-AC-COVERED
          type: trace.acs_in_file
          with: { trace: "{feature_dir}/trace.yaml", file: "{feature_dir}/spec.md" }
        - id: SPEC-NO-CLARIFY
          type: text.absent
          with: { file: "{feature_dir}/spec.md", patterns: ["\\[NEEDS CLARIFICATION"] }
        - id: SPEC-WAVE-SCOPE
          type: wave.scope            # waves on: every AC in trace.yaml is in the current or an earlier wave
          with: { trace: "{feature_dir}/trace.yaml" }
        - id: SPEC-DATA-CLASS
          type: text.present
          severity: warn
          with: { file: "{feature_dir}/spec.md", patterns: ["Classification"] }

    # ------------------------------------------------------------------ plan vs baseline
    - id: plan
      stage: plan->tasks
      description: Every applicable feature-scope NFR is Addressed, N/A or Waived (with ADR) in plan.md.
      context: feature
      checks:
        - id: PLAN-FILE
          type: files.exist
          with: { paths: ["{feature_dir}/plan.md"] }
        - id: PLAN-NFR-CONFORMANCE
          type: nfr.conformance
          with: { file: "{feature_dir}/plan.md", scope: feature }
        - id: PLAN-NO-CLARIFY
          type: text.absent
          with: { file: "{feature_dir}/plan.md", patterns: ["\\[NEEDS CLARIFICATION"] }
        - id: PLAN-ADR-UNIQUE
          type: adr.unique
          with: { dir: docs/adr }

    # ------------------------------------------------------------------ landing zone
    - id: baseline
      stage: landing-zone
      description: Platform-scope NFRs are satisfied once for the repository and the stack skeleton exists.
      context: project
      record: .ekit/ledger/baseline.yaml   # a passing run is recorded; `ekit status` reads it
      checks:
        - id: BASE-CONFORMANCE
          type: nfr.conformance
          with: { file: "docs/engineering/baseline-conformance.md", scope: platform }
        - id: BASE-SKELETON
          type: profile.required_paths
          with: {}
        - id: BASE-ENV
          type: profile.environment     # ENV-01: pinned runtime, isolated env, git-ignored, untracked
          with: {}
        - id: BASE-ADR-DIR
          type: files.exist
          with: { paths: ["docs/adr"] }
        - id: BASE-ADR-UNIQUE
          type: adr.unique
          with: { dir: docs/adr }
        - id: BASE-LINT
          type: profile.command
          severity: warn          # becomes error once the skeleton is generated
          with: { command: lint }
        - id: BASE-CONSTITUTION
          type: constitution.intact     # 0.3.0: principles I-VIII match the kit template; unratified = warn
          with: {}
        - id: BASE-GOLDEN-INTACT
          type: golden.intact           # 0.3.0: golden projects: core files match .ekit/golden.lock.yaml
          with: {}

    # ------------------------------------------------------------------ Gherkin
    - id: scenarios
      stage: spec->gherkin
      description: Every acceptance criterion has >=1 Gherkin scenario with unique @SCN tag.
      context: feature
      checks:
        - id: GHERKIN-PARSE
          type: gherkin.valid
          with: { dir: "{feature_dir}/features" }
        - id: GHERKIN-SCN-UNIQUE
          type: gherkin.scn_unique
          with: { dir: "specs", tag_pattern: "SCN-\\d{3}-\\d{2}" }
        - id: GHERKIN-AC-COVERED
          type: gherkin.ac_covered
          with: { dir: "{feature_dir}/features", trace: "{feature_dir}/trace.yaml" }
        - id: GHERKIN-UI-ENTRY
          type: gherkin.ui_entry
          severity: warn
          with: { dir: "{feature_dir}/features" }

    # ------------------------------------------------------------------ TDD red
    - id: red
      stage: gherkin->failing-tests
      description: Acceptance suite runs; every scenario of this feature is bound and FAILS. Records a ledger entry.
      context: feature
      checks:
        - id: RED-STEPS-ASSERT
          type: bdd.vacuous_steps
          with: { dir: "{feature_dir}/features" }
        - id: RED-STEPS-BOUND
          type: bdd.steps_bound        # every step has a definition the binding module can see
          with: { dir: "{feature_dir}/features" }
        - id: RED-STATE-TYPED
          type: bdd.typed_state        # 0.3.0 (golden): scenario state on ScenarioContext, never a shared dict
          with: { dir: "{feature_dir}/features" }
        - id: RED-GLUE-TYPED
          type: bdd.glue_typecheck     # 0.4.0: type-check the bound test module; steps after the first failure never run in red
          with: { dir: "{feature_dir}/features" }
        - id: RED-NO-EXEMPLAR
          type: golden.no_exemplar     # 0.3.0 (golden): the feature is not, and does not use, the reference slice
          with: { dir: "{feature_dir}/features" }
        - id: RED-RUN
          type: bdd.run
          with: { expect: red, dir: "{feature_dir}/features", record: true }
        - id: RED-CLEAN-FAILURE
          type: bdd.clean_failure      # a scenario must fail on an assertion, not error out of broken test glue
          with: { dir: "{feature_dir}/features" }
        - id: RED-LINT
          type: profile.command
          severity: warn          # surface lint issues before the freeze, not after, at green
          with: { command: lint }
        - id: RED-ROUTE-STUBBED
          type: bdd.route_stubbed      # 0.4.0 (golden): a scenario fails with 501 from a stub, never 404
          with: { dir: "{feature_dir}/features" }
        - id: RED-BUG-REPRODUCED
          type: change.bug_reproduced  # 0.5.0 (bug change requests): fails on an assertion against untouched, committed code
          with: { dir: "{feature_dir}/features" }
        - id: RED-CHANGE-SUPERSEDES
          type: change.supersedes_retired   # 0.5.0: reminder; the person retires superseded scenarios before green
          severity: warn
          with: {}

    # ------------------------------------------------------------------ red recorded (no test run)
    - id: red-recorded
      stage: before-implement
      description: A red ledger entry exists for every scenario of this feature and is committed (cheap check used before coding).
      context: feature
      checks:
        - id: REDREC-LEDGER
          type: ledger.red_first
          with: { dir: "{feature_dir}/features" }
        - id: REDREC-COMMITTED
          type: ledger.red_committed   # the red evidence (tests, feature files, ledger) is committed as recorded
          with: {}

    # ------------------------------------------------------------------ TDD green
    - id: green
      stage: failing-tests->code
      description: Every scenario of this feature passes, was red first, and quality commands pass.
      context: feature
      checks:
        - id: GREEN-RED-FIRST
          type: ledger.red_first
          with: { dir: "{feature_dir}/features" }
        - id: GREEN-RED-COMMITTED
          type: ledger.red_committed
          with: {}
        - id: GREEN-TESTS-UNCHANGED
          type: ledger.tests_unchanged
          with: { dir: "{feature_dir}/features" }
        - id: GREEN-CONTRACT-INTACT
          type: ledger.contract_intact  # 0.4.0 split freeze: step bindings of bound modules unchanged since red
          with: { dir: "{feature_dir}/features" }
        - id: GREEN-GLUE-NOT-WEAKENED
          type: bdd.glue_not_weakened   # 0.4.0 split freeze: Then assertions kept; no skips / always-true asserts added
          with: { dir: "{feature_dir}/features" }
        - id: GREEN-NO-SHADOW-GLUE
          type: bdd.no_shadow_glue      # 0.4.0 split freeze: no new conftest.py or step module outside the contract
          with: { dir: "{feature_dir}/features" }
        - id: GREEN-STEPS-BOUND
          type: bdd.steps_bound        # also catches features recorded red before ekit 0.2.1
          with: { dir: "{feature_dir}/features" }
        - id: GREEN-GOLDEN-INTACT
          type: golden.intact          # 0.3.0 (golden): implementation did not rewrite the core or its test helpers
          with: {}
        - id: GREEN-NO-EXEMPLAR
          type: golden.no_exemplar
          with: { dir: "{feature_dir}/features" }
        - id: GREEN-GLUE-STILL-RED
          type: bdd.replay_red          # 0.4.0 split freeze: amended glue still fails cleanly against the red-time code
          with: { dir: "{feature_dir}/features" }
        - id: GREEN-CHANGE-SUPERSEDED
          type: change.supersedes_retired   # 0.5.0: superseded scenarios of delivered features are retired (`ekit change retire`)
          with: {}
        - id: GREEN-RUN
          type: bdd.run
          with: { expect: green, dir: "{feature_dir}/features", record: true }
        - id: GREEN-ENV
          type: profile.environment
          with: {}
        - id: GREEN-UNIT
          type: profile.command
          with: { command: unit }
        - id: GREEN-LINT
          type: profile.command
          with: { command: lint }
        - id: GREEN-COVERAGE
          type: profile.command
          with: { command: coverage }
        - id: GREEN-SCA
          type: profile.command
          severity: warn
          with: { command: sca }
        - id: GREEN-NO-DUMMY
          type: green.no_dummy         # 0.7.0, enterprise rigor only (rigor.policy.yaml `add`): no Day-0 dummy in a non-dev environment
          with: {}
        - id: GREEN-TASKS-DONE
          type: tasks.all_done
          severity: warn
          with: { file: "{feature_dir}/tasks.md" }
