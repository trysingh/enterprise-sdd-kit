[project]
name = "enterprise-sdd-kit"
version = "0.1.5"
description = "BRD > PRD > SDD > TDD landing zone for GitHub Spec Kit + OpenCode, with an enterprise engineering baseline and local gates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]
license = { text = "MIT" }

[project.scripts]
ekit = "ekit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ekit"]
